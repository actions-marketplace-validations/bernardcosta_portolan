name: spriggs init

# Cold start, by hand: Actions tab -> spriggs init -> Run workflow. Spriggs explores the repository,
# writes a first set of docs and opens a pull request with them. It never commits to the branch it ran on.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  init:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Dogfood: this repo is the action. Other repos write `uses: bernardcosta/portolan@main` and no checkout.
      - uses: actions/checkout@v4
      - uses: ./
        with:
          command: init
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: ${{ vars.SPRIGGS_MODEL }}
          app-id: ${{ vars.SPRIGGS_APP_ID }}
          app-private-key: ${{ secrets.SPRIGGS_APP_PRIVATE_KEY }}
