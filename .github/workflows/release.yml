name: release

# Push a tag such as v1.2.0 to release. The tag must match the version in packages/spriggs/package.json.
# A full release also moves the major tag (v1), which is what users write in `uses:`. A pre-release
# (v1.2.0-rc.1) does not move it.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run typecheck
      - name: Check the version
        run: |
          version="v$(jq -r .version packages/spriggs/package.json)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --latest
            major="${GITHUB_REF_NAME%%.*}"
            git tag -f "$major"
            git push -f origin "refs/tags/$major"
          fi
