name: spriggs

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# One run at a time per pull request. A cancelled run could leave a PR without its label.
concurrency:
  group: spriggs-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  spriggs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The head commit, not the merge commit. Works for forks too, so the harness can skip them.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run spriggs run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
