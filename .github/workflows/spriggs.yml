name: spriggs

# A pull request starts the normal run. A start by hand (Actions tab -> spriggs -> Run workflow) is the
# cold start: Spriggs explores the repository and opens a pull request that fills the gaps in its docs.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# One run at a time per pull request, and one cold start at a time. A cancelled run could leave a PR without its label.
concurrency:
  group: spriggs-${{ github.event.pull_request.number || 'init' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  spriggs:
    # Spriggs's own docs commits never start a run. The harness checks this too; this line saves the runner.
    if: github.actor != 'github-actions[bot]' && github.actor != format('{0}[bot]', vars.SPRIGGS_APP_SLUG)
    runs-on: ubuntu-latest
    # A backstop: the agent's own time budget is checked only between turns.
    timeout-minutes: 60
    steps:
      # Dogfood: this repo is the action. Other repos write `uses: bernardcosta/portolan@main` and no checkout.
      # Never add pull_request_target to this workflow: it gives fork pull requests the secrets, and with
      # `uses: ./` the action's code would come from the fork.
      - uses: actions/checkout@v4
      - uses: ./
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          # provider/model. Leave empty to use anthropic/claude-opus-5-5 when the Anthropic key is set.
          model: ${{ vars.SPRIGGS_MODEL }}
          # Optional GitHub App. Without it Spriggs uses the workflow's own token.
          app-id: ${{ vars.SPRIGGS_APP_ID }}
          app-private-key: ${{ secrets.SPRIGGS_APP_PRIVATE_KEY }}
