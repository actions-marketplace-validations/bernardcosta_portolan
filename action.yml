name: Spriggs
description: Keeps docs/ in step with the code on every pull request. Edits the docs, writes a change entry, commits to the branch.
author: bernardcosta
branding:
  icon: book-open
  color: green

inputs:
  model:
    description: provider/model, for example anthropic/claude-opus-5-5. Default picks Anthropic when its key is set.
    required: false
    default: ""
  anthropic-api-key:
    description: Key for models under anthropic/.
    required: false
    default: ""
  openai-api-key:
    description: Key for models under openai/.
    required: false
    default: ""
  openrouter-api-key:
    description: Key for models under openrouter/.
    required: false
    default: ""
  github-token:
    description: Token for the comment, the label, the status and the push. Pushes with the default token do not start other workflows.
    required: false
    default: ${{ github.token }}
  app-id:
    description: Optional GitHub App ID. With app-private-key, Spriggs acts as the App and its pushes start other workflows.
    required: false
    default: ""
  app-private-key:
    description: The App's private key (PEM).
    required: false
    default: ""
  max-lines:
    description: Changed lines above which Spriggs asks to split the pull request. Default 5000.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        # The head commit, not the merge commit. Full history for the diff and the merge base.
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.11
    - name: Install Spriggs
      shell: bash
      run: cd "$GITHUB_ACTION_PATH" && bun install --frozen-lockfile --production
    - id: app
      # A fork has no secrets, so no token can be minted for it; Spriggs skips forks anyway.
      if: inputs.app-id != '' && github.event.pull_request.head.repo.full_name == github.repository
      uses: actions/create-github-app-token@v2
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}
    - name: Run Spriggs
      shell: bash
      run: bun "$GITHUB_ACTION_PATH/packages/spriggs/src/cli.ts" run
      env:
        GITHUB_TOKEN: ${{ steps.app.outputs.token || inputs.github-token }}
        SPRIGGS_APP_SLUG: ${{ steps.app.outputs.app-slug }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        OPENAI_API_KEY: ${{ inputs.openai-api-key }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        SPRIGGS_MODEL: ${{ inputs.model }}
        SPRIGGS_MAX_LINES: ${{ inputs.max-lines }}
